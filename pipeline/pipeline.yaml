# Coverage Desk pipeline config — tunable, not secret.
# No API keys live here or anywhere in this repo: every CLI call below runs
# on subscription/OAuth login (ChatGPT, Claude, Google), not a metered key.
# See COVERAGE-DESK-SPEC.md section 4 for how each was verified headless.

models:
  draft: codex            # Step 1  — codex exec
  review: claude           # Step 2  — claude -p
  ground: antigravity      # Step 2.5 — agy -p, invoked BY Step 3's claude -p
                            # call itself (not a separate orchestrated step —
                            # run-pipeline.sh never calls agy -p directly;
                            # Claude decides which claims to ground and calls
                            # agy -p via its own Bash tool). Fallback: vertex-gemini.
  feedback: claude         # Step 3  — claude -p --allowedTools "Bash,Read,Write,Edit"
  reconcile: codex         # Step 4  — codex exec
  arbitrate: claude        # Step 5  — claude -p --allowedTools "Bash,Read,Edit"

cli:
  codex:
    command: "codex exec --skip-git-repo-check -s workspace-write"
    # -s workspace-write is required, not optional — codex exec defaults to a
    # read-only sandbox and silently fails to save any output file without it.
  claude:
    command: "claude -p --allowedTools \"Bash,Read,Edit\""
    # The prompt MUST be piped via stdin, never passed positionally after
    # --allowedTools — that flag greedily consumes the next argv as more
    # comma-separated tool rules and shreds the prompt. Invoke as:
    #   cat prompt.md | claude -p --allowedTools "Bash,Read,Edit"
    # Also requires CLAUDE_CODE_OAUTH_TOKEN to be set in the environment
    # (from `claude setup-token`) — a bare interactive /login does not
    # authenticate claude -p for headless use.
  antigravity:
    command: "agy -p"
  vertex_gemini_fallback:
    enabled: false   # flip on if antigravity's free tier gets rate-limited at volume

timeouts_seconds:
  # Enforced in run-pipeline.sh via `gtimeout` (coreutils) — macOS's BSD
  # `timeout` doesn't exist, so `brew install coreutils` is required.
  draft: 300
  review: 180
  feedback: 600   # Step 2.5 no longer runs separately (see models.ground
                   # below) — Step 3's claude -p call grounds each accuracy
                   # candidate itself via agy -p inside its own turn, so this
                   # timeout has to cover the base work plus every grounding
                   # call, not just feedback.json authoring.
  reconcile: 240
  arbitrate: 300   # bumped from 120 — Step 5 also self-checkpoints
                    # (commit + push) and can open a PR-as-flag on a 5b
  checkpoint: 120

notify:
  # Two events trigger a notification: a Step 5b flag (Codex/Claude disagree
  # and stayed disagreeing) and a script reaching Step 6 (ready for the
  # owner's final read before locking to Shared/).
  events: [on_flag, on_ready_for_review]
  supervised:
    # When the pipeline is being run inside a live Claude Code session
    # (e.g. a hand-run), Claude fires the PushNotification tool directly —
    # desktop notification, plus phone push if Remote Control is connected.
    method: push_notification_tool
  unattended:
    # run-pipeline.sh running standalone (no live Claude session to call a
    # tool from): built in Phase 2. The orchestrator itself fires a native
    # macOS notification — `osascript -e 'display notification "..." with
    # title "Coverage Desk"'` — at two deterministic points: episode ready
    # for owner review, and a point getting flagged after Step 5. This
    # doesn't depend on any `claude -p` subprocess successfully calling an
    # interactive-only tool. Phone delivery while away from the Mac would
    # need a separate lightweight channel on top of this — not built, not
    # decided.
    method: macos_notification
    status: built

paths:
  episode_root: "Projects/{slug}"
  codex_dir: "Projects/{slug}/Codex"
  claude_dir: "Projects/{slug}/Claude"
  shared_dir: "Projects/{slug}/Shared"

github:
  operator: claude          # single writer — see COVERAGE-DESK-SPEC.md section 5
  pr_as_flag: true          # step 5b opens a PR instead of only notifying
